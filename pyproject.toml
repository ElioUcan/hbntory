[project]
name = "hbentory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ElioUcan", email = "eliozapata2006@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.2",
    "fastmcp>=4.2.1",
    "google-adk[mcp,toolbox]>=2.15.1",
    "litellm>=1.111.0",
    "psycopg2>=2.9.13",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
    "toolbox-core>=1.4.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
hbentory = "hbentory:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
